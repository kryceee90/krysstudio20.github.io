<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botanical Train · Kryss Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#132119;color:#fff;font-family:Arial,sans-serif}
main{position:fixed;inset:0;overflow:hidden;background:url('assets/malaysia-woodland.webp') center/cover}
canvas{display:block;width:100%;height:100%}
nav{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:5px;border-radius:28px;background:#111b;backdrop-filter:blur(12px);white-space:nowrap}
button{border:0;cursor:pointer;font:10px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:24px;padding:11px 16px;background:#eae9df;color:#25281f}
button[aria-current=true]{background:#c4d59e}button:focus-visible{outline:3px solid #fff;outline-offset:4px}
.brand{padding:0 12px;font-size:10px;letter-spacing:.12em}.control{position:absolute;right:22px;bottom:22px;background:#172019b8;color:white;border:1px solid #ffffff70;backdrop-filter:blur(12px)}
#status{position:absolute;bottom:24px;left:24px;font-size:11px;letter-spacing:.1em;text-shadow:0 1px 8px #000;background:#14201666;padding:8px 12px;border-radius:20px}
@media(max-width:600px){.brand{display:none}nav{top:16px}button{padding:10px 13px}.control{right:14px;bottom:16px}#status{left:14px;bottom:16px}}
</style>
</head>
<body>
<main aria-label="An immersive botanical train journey">
<canvas id="journey" role="img" aria-label="Dense tropical greenery and hibiscus surrounding wooden train doors"></canvas>
<nav aria-label="Destinations"><span class="brand">KRYSS STUDIO</span><button data-stop="0" aria-current="true">Malaysia</button><button data-stop="1" aria-current="false">Japan</button><button data-stop="2" aria-current="false">Korea</button></nav>
<span id="status" role="status">Loading gardens…</span>
<button class="control" id="control" aria-label="Pause animation" disabled>Pause Ⅱ</button>
</main>
<script>
'use strict';
const canvas=document.querySelector('#journey'),ctx=canvas.getContext('2d',{alpha:false});
const control=document.querySelector('#control'),status=document.querySelector('#status');
const stops=[['Malaysia','malaysia'],['Japan','japan'],['South Korea','korea']];
const buttons=[...document.querySelectorAll('[data-stop]')];
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let playing=!reduced.matches,ready=false,index=0,elapsed=0,last=0,raf=0,w=0,h=0,dpr=1;
const duration=11000,door={x:550,y:42,width:436,height:836},cx=768,cy=460;
const clamp=t=>Math.max(0,Math.min(1,t)),smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const images=stops.map(([,name])=>{const img=new Image();img.src='assets/'+name+'-woodland.webp';return img});
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);if(ready)render()}
function updateUI(){buttons.forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));status.textContent=stops[index][0];canvas.setAttribute('aria-label',stops[index][0]+': botanical train with wooden doors and floor-to-ceiling flowers');control.textContent=playing?'Pause Ⅱ':'Play ▷';control.setAttribute('aria-label',playing?'Pause animation':'Play animation')}
function baseScale(){return Math.max(w/1536,h/(2*Math.min(cy,1024-cy)))}
function drawScene(img,scale){ctx.drawImage(img,w/2-cx*scale,h/2-cy*scale,1536*scale,1024*scale)}
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#132119';ctx.fillRect(0,0,w,h);
 const base=baseScale(),t=elapsed/duration;
 const opening=smooth((t-.25)/.25),travel=smooth((t-.52)/.46);
 const approach=1+.12*smooth(t/.52);
 // Advance until the OPEN doorway is outside all viewport edges.
 const through=Math.max(w/(door.width*base),h/(door.height*base))*1.06;
 const zoom=approach+(Math.max(through,approach)-approach)*travel;
 const s=base*zoom,dx=w/2+(door.x-cx)*s,dy=h/2+(door.y-cy)*s,dw=door.width*s,dh=door.height*s;
 // The next carriage is behind the real doorway, never a closing screen overlay.
 if(opening===0){drawScene(images[index],s);return}
 drawScene(images[(index+1)%3],base);
 ctx.save();ctx.beginPath();ctx.rect(0,0,w,h);ctx.rect(dx,dy,dw,dh);ctx.clip('evenodd');drawScene(images[index],s);ctx.restore();
 // Slide the photographed wooden leaves behind the flower-covered frame.
 ctx.save();ctx.beginPath();ctx.rect(dx,dy,dw,dh);ctx.clip();
 const half=door.width/2,shift=dw/2*opening;
 ctx.drawImage(images[index],door.x,door.y,half,door.height,dx-shift,dy,dw/2,dh);
 ctx.drawImage(images[index],door.x+half,door.y,half,door.height,dx+dw/2+shift,dy,dw/2,dh);
 ctx.restore();
}
function tick(now){raf=0;if(!ready||!playing||document.hidden){last=0;return}if(last)elapsed+=Math.min(now-last,100);last=now;if(elapsed>=duration){elapsed%=duration;index=(index+1)%3;updateUI()}render();raf=requestAnimationFrame(tick)}
function schedule(){last=0;if(ready&&playing&&!document.hidden&&!raf)raf=requestAnimationFrame(tick)}
control.addEventListener('click',()=>{playing=!playing;if(!playing){cancelAnimationFrame(raf);raf=0;last=0}updateUI();schedule()});
buttons.forEach((b,i)=>b.addEventListener('click',()=>{if(!ready)return;index=i;elapsed=0;last=0;updateUI();render();schedule()}));
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;last=0}else schedule()});
reduced.addEventListener('change',e=>{if(e.matches){playing=false;cancelAnimationFrame(raf);raf=0;last=0;updateUI()}});
addEventListener('resize',resize);resize();
Promise.all(images.map(img=>img.decode())).then(()=>{ready=true;control.disabled=false;updateUI();render();schedule()}).catch(()=>{status.textContent='Images could not load — please reload.';control.textContent='Unavailable'});
// Explicit local visual regression mode only.
if(new URLSearchParams(location.search).has('test'))window.previewFrame=(country,ms)=>{playing=false;cancelAnimationFrame(raf);raf=0;index=country;elapsed=ms;updateUI();render()};
</script>
</body>
</html>
